<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>2nd Life Lab · 실험 아카이브 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#1A2027; --deep:#12171D; --card:#212932;
  --sage:#8FB0A9; --sage-dim:#5E8A82; --mist:#E4E7E3;
  --amber:#D8A24A; --line:rgba(143,176,169,.20); --muted:#93A0A6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--deep);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px; background-attachment:fixed;
  color:var(--mist); word-break:keep-all; line-height:1.65;
  min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 60px) calc(env(safe-area-inset-left) + 16px);
}
.wrap{max-width:740px;margin:0 auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.26em;
  color:var(--sage);text-transform:uppercase;margin-bottom:14px;}
h1{font-size:29px;font-weight:900;margin:0 0 10px;letter-spacing:-.025em;line-height:1.3;}
h1 em{font-style:normal;color:var(--sage);}
.lede{color:var(--muted);font-size:14px;margin:0 0 22px;}
.stats{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--mist);}
.stat span{font-size:11.5px;color:var(--muted);}

.tools{position:sticky;top:0;z-index:5;background:var(--deep);
  padding:10px 0 12px;margin-bottom:6px;}
#q{width:100%;background:var(--card);color:var(--mist);border:1px solid var(--line);
  border-radius:11px;padding:14px 15px;font-size:16px;font-family:inherit;
  outline:none;min-height:52px;}
#q:focus{border-color:var(--sage);}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:2px;}
.chip{white-space:nowrap;background:transparent;color:var(--muted);cursor:pointer;
  border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;
  font-family:inherit;min-height:38px;}
.chip.on{background:var(--sage);color:var(--deep);border-color:var(--sage);font-weight:700;}

.exp{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:14px;overflow:hidden;}
.exp-head{display:flex;gap:13px;align-items:flex-start;padding:17px;cursor:pointer;}
.no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);
  letter-spacing:.1em;flex:0 0 auto;padding-top:3px;}
.exp-t{flex:1;font-weight:700;font-size:16px;line-height:1.5;}
.arrow{color:var(--sage);flex:0 0 auto;transition:transform .2s;padding-top:2px;}
@media (prefers-reduced-motion:reduce){.arrow{transition:none;}}
.exp.open .arrow{transform:rotate(90deg);}
.exp-body{display:none;border-top:1px solid var(--line);padding:4px 17px 17px;}
.exp.open .exp-body{display:block;}

.sec{margin-top:17px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;}
.sec-t{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
  color:var(--sage);text-transform:uppercase;}
.cp{background:transparent;color:var(--sage);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;font-size:12px;font-family:inherit;
  cursor:pointer;min-height:34px;}
.box{background:var(--deep);border-radius:10px;padding:13px 14px;font-size:14.5px;
  white-space:pre-wrap;}
.hook{font-size:18px;font-weight:900;line-height:1.45;}
.scene{border-left:2px solid var(--sage-dim);padding-left:13px;margin-bottom:14px;}
.scene:last-child{margin-bottom:0;}
.scene .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);
  letter-spacing:.1em;margin-bottom:4px;}
.scene .v{font-size:13px;color:var(--muted);margin-bottom:5px;}
.scene .s{font-size:14.5px;font-weight:500;}
.tag{display:inline-block;background:var(--deep);border:1px solid var(--line);
  border-radius:18px;padding:4px 11px;margin:0 5px 6px 0;font-size:12.5px;color:var(--sage);}
.fill{color:var(--amber);font-weight:600;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);
  margin-top:28px;padding-top:16px;}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:var(--sage);color:var(--deep);font-weight:700;font-size:14px;
  padding:11px 20px;border-radius:22px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:20;}
.toast.on{opacity:1;}
</style>
</head>

</div>

var stage = "all", kw = "";

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fill(s){return esc(s).replace(/○○/g,'<span class="fill">○○</span>');}

var toast = document.getElementById("toast");
function copy(txt){
  function ok(){ toast.classList.add("on"); setTimeout(function(){toast.classList.remove("on");},1300); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){fb(txt);ok();});
  } else { fb(txt); ok(); }
}
function fb(t){
  var a=document.createElement("textarea");
  a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(a);
}
window.doCopy=function(i,k){
  var d=DATA[i], t="";
  if(k==="hook") t=d.hook;
  else if(k==="sc") t=d.sc.map(function(s){return "["+s[0]+"] "+s[1]+"\n자막: "+s[2];}).join("\n\n");
  else if(k==="cap") t=d.cap+"\n\n"+d.tags.join(" ");
  else if(k==="pin") t=d.pin;
  else if(k==="th") t=d.th;
  else if(k==="all") t="실험 "+d.n+". "+d.t+"\n\n[썸네일]\n"+d.hook
    +"\n\n[릴스]\n"+d.sc.map(function(s){return "["+s[0]+"] "+s[1]+"\n자막: "+s[2];}).join("\n\n")
    +"\n\n[캡션]\n"+d.cap+"\n\n"+d.tags.join(" ")+"\n\n[고정댓글]\n"+d.pin+"\n\n[쓰레드]\n"+d.th;
  copy(t);
};

function sec(title,i,key,inner){
  return '<div class="sec"><div class="sec-head"><span class="sec-t">'+title+'</span>'
    +'<button class="cp" onclick="event.stopPropagation();doCopy('+i+',\''+key+'\')">복사</button></div>'
    +inner+'</div>';
}

function render(){
  var q = kw.trim().toLowerCase();
  var html = "";
  DATA.forEach(function(d,i){
    if(stage!=="all" && String(d.s)!==stage) return;
    if(q){
      var blob=(d.t+d.hook+d.cap+d.th+d.tags.join(" ")).toLowerCase();
      if(blob.indexOf(q)===-1) return;
    }
    html += '<div class="exp" id="e'+i+'">'
      + '<div class="exp-head" onclick="document.getElementById(\'e'+i+'\').classList.toggle(\'open\')">'
      + '<span class="no">'+String(d.n).padStart(2,"0")+'</span>'
      + '<span class="exp-t">'+esc(d.t)+'</span><span class="arrow">›</span></div>'
      + '<div class="exp-body">'
      + sec("썸네일",i,"hook",'<div class="box hook">'+fill(d.hook)+'</div>')
      + sec("릴스 대본",i,"sc", d.sc.map(function(s){
          return '<div class="scene"><div class="m">'+esc(s[0])+'</div><div class="v">'+esc(s[1])
            +'</div><div class="s">'+fill(s[2])+'</div></div>';
        }).join(""))
      + sec("캡션",i,"cap",'<div class="box">'+fill(d.cap)+'</div><div style="margin-top:10px;">'
          + d.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>')
      + sec("고정댓글",i,"pin",'<div class="box">'+fill(d.pin)+'</div>')
      + sec("쓰레드",i,"th",'<div class="box">'+fill(d.th)+'</div>')
      + '<div class="sec"><button class="cp" style="width:100%;min-height:44px;"'
      + ' onclick="event.stopPropagation();doCopy('+i+',\'all\')">전체 한 번에 복사</button></div>'
      + '</div></div>';
  });
  document.getElementById("list").innerHTML = html ||
    '<div class="empty">검색 결과가 없어요. 다른 키워드로 찾아보세요.</div>';
}

document.getElementById("q").addEventListener("input", function(){ kw=this.value; render(); });
Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
  c.addEventListener("click", function(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(x){x.classList.remove("on");});
    this.classList.add("on"); stage=this.getAttribute("data-s"); render();
  });
});
render();
</script>
</body>
</html>
